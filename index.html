<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>常亮時鐘</title><link rel="manifest" href="./manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="時鐘"><meta name="theme-color" content="#080807"><link rel="apple-touch-icon" href="./icon-192.png"><style>
:root{color-scheme:dark;--ink:#efb978;--muted:#8c785f}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080807}body{color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif;height:100dvh;padding: max(16px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));display:grid;place-items:center;text-align:center}main{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;padding-bottom:16px}#time{font-family:ui-monospace,Menlo,monospace;font-size:min(22vw,48dvh);font-weight:300;letter-spacing:-.065em;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:0 0 40px #eaa14a0c}#seconds{font-size:.25em;letter-spacing:0;margin-left:.5em;color:var(--muted);display:inline-block;min-width:1.3em;vertical-align:baseline}#date{font-size:clamp(13px,3.8dvh,22px);font-weight:400;letter-spacing:.15em;color:var(--muted);margin:14px 0 0}button{background:#171612;color:#c7b69e;border:1px solid #393229;border-radius:100px;padding:9px 16px;font-size:13px;min-height:40px;margin:4px;touch-action:manipulation}#controls{position:absolute;bottom:0;left:0;width:100%;transition:opacity .5s;background:linear-gradient(transparent,#080807 24%);padding:16px 4px 0}#status{color:#a39889;font:12px/1.5 -apple-system,sans-serif;max-width:620px;margin:6px auto 0}body.dim{--ink:#966644;--muted:#64503d}body.hide #controls{opacity:0;pointer-events:none}body.hide #controls:focus-within{opacity:1;pointer-events:auto}body:not(.hide) #time{opacity:.35}body:not(.hide) #date{opacity:.35}@media(orientation:portrait){#time{font-size:24vw}#seconds{display:block;font-size:.27em;margin:12px 0 0}#date{font-size:14px;letter-spacing:.06em}}@media(orientation:landscape) and (max-height:300px){#time{font-size:min(21vw,42dvh)}#date{margin-top:6px}}
</style><style>#date,#controls{display:none!important}body:not(.hide) #time{opacity:1}main{padding-bottom:0}body{padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}#time{font-size:100px;line-height:1;letter-spacing:-.09em;flex-shrink:0;transform:scaleY(1.32)}#seconds{font-size:.22em;margin-left:.28em;min-width:1.3em}@media(orientation:portrait){#seconds{display:inline-block;margin-left:.28em}}</style><main><div id="time"></div></main><script>
let lock=null,pending=false;const time=document.getElementById('time');function tick(){const d=new Date();time.replaceChildren(document.createTextNode(d.toLocaleTimeString('en-GB',{hour12:false,hour:'2-digit',minute:'2-digit'})));const s=document.createElement('span');s.id='seconds';s.textContent=String(d.getSeconds()).padStart(2,'0');time.append(s)}function fit(){const area=document.querySelector('main');time.style.fontSize='100px';const r=time.getBoundingClientRect();const size=100*Math.min(area.clientWidth/r.width,area.clientHeight/r.height)*.98;time.style.fontSize=size+'px'}tick();fit();setInterval(tick,1000);window.addEventListener('resize',fit);if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);document.fonts.ready.then(fit);
async function wake(){if(pending||document.visibilityState!=='visible'||!navigator.wakeLock||(lock&&!lock.released))return;pending=true;try{const current=await navigator.wakeLock.request('screen');lock=current;current.addEventListener('release',()=>{if(lock===current)lock=null})}catch(e){}finally{pending=false}}wake();document.addEventListener('pointerdown',wake);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});
if('serviceWorker' in navigator && location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
